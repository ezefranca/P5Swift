name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/documentation.yml"
      - "Package.swift"
      - "Scripts/**"
      - "Sources/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-26
    timeout-minutes: 20
    env:
      P5_DOCUMENTATION_BASE_URL: https://ezefranca.com/p5.swift

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build DocC archive
        env:
          P5_DERIVED_DATA: ${{ runner.temp }}/P5DerivedData
        run: >-
          xcodebuild docbuild
          -scheme P5
          -destination 'generic/platform=macOS'
          -derivedDataPath "$P5_DERIVED_DATA"
          CODE_SIGNING_ALLOWED=NO
          DOCC_HOSTING_BASE_PATH=p5.swift

      - name: Transform archive for static hosting
        env:
          P5_DERIVED_DATA: ${{ runner.temp }}/P5DerivedData
          P5_DOCUMENTATION_SITE: ${{ runner.temp }}/P5Documentation
        run: |
          xcrun docc process-archive transform-for-static-hosting \
            "$P5_DERIVED_DATA/Build/Products/Debug/P5.doccarchive" \
            --output-path "$P5_DOCUMENTATION_SITE" \
            --hosting-base-path p5.swift

          P5_VERSION=$(git describe --tags --abbrev=0 --match '[0-9]*')
          python3 Scripts/prepare_documentation_site.py \
            --site "$P5_DOCUMENTATION_SITE" \
            --base-url "$P5_DOCUMENTATION_BASE_URL" \
            --version "$P5_VERSION" \
            --repository-root "$GITHUB_WORKSPACE"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/P5Documentation

  deploy:
    name: Deploy DocC site
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
